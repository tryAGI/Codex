name: Realtime parity inventory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_release_ready:
        description: Fail unless every reviewed parity scenario has passed
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  parity-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate pinned inventory and checker
        run: |
          python3 -B scripts/realtime-parity.py self-test
          python3 -B scripts/realtime_parity_evidence.py self-test
          python3 -B scripts/realtime_parity_live_probe.py self-test
      - name: Generate deterministic report
        run: python3 -B scripts/realtime-parity.py report > realtime-parity-report.json
      - name: Store machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: realtime-parity-report
          path: realtime-parity-report.json
      - name: Require complete acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.require_release_ready
        run: python3 -B scripts/realtime-parity.py gate

  offline-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run credential-free conformance tests and generate revision-bound receipt
        run: python3 -B scripts/realtime_parity_evidence.py run --output realtime-parity-offline-receipt.json
      - name: Store sanitized per-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-parity-offline-receipt
          path: realtime-parity-offline-receipt.json
          if-no-files-found: warn
