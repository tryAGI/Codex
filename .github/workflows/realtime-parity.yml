name: Realtime parity inventory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_release_ready:
        description: Fail unless every reviewed parity scenario has passed
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  parity-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned inventory and checker
        run: python3 scripts/realtime-parity.py self-test
      - name: Generate deterministic report
        run: python3 scripts/realtime-parity.py report > realtime-parity-report.json
      - name: Store machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: realtime-parity-report
          path: realtime-parity-report.json
      - name: Require complete acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.require_release_ready
        run: python3 scripts/realtime-parity.py gate
