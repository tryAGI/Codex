name: Live
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the latest stable Codex CLI
        run: npm install --global @openai/codex@latest

      - name: Run live tests
        env:
          CODEX_LIVE_TESTS: '1'
          # Optional. Without them the authenticated tests are skipped and only the App Server test runs.
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_ACCOUNT_ID: ${{ secrets.CODEX_ACCOUNT_ID }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
        run: dotnet test Codex.slnx --configuration Release --filter Category=Live --logger GitHubActions
