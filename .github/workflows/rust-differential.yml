name: Pinned Rust differential
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Independent differential suite
        type: choice
        options: [filesystem, thread-lifecycle, model-catalog]
        default: filesystem

permissions:
  contents: read

jobs:
  differential:
    # Explicit opt-in; no provider credentials or live calls.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the managed differential test assembly
        run: dotnet build src/tests/tryAGI.Codex.Tests/tryAGI.Codex.Tests.csproj
      - name: Fetch exact upstream Rust release archive
        run: |
          set -euo pipefail
          asset=codex-package-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --silent --show-error --max-time 180 --output "$RUNNER_TEMP/$asset" "https://github.com/openai/codex/releases/download/rust-v0.172.0/$asset"
          printf '%s  %s\n' 63e3b00065ed7f62166d0522e17f663cb866a31d80d03e63365482ed34a1d991 "$RUNNER_TEMP/$asset" | sha256sum --check
      - name: Compare native and Rust RPCs with external network disconnected
        env:
          DIFFERENTIAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          parent_netns="$(readlink /proc/self/ns/net)"
          # VSTest communicates with its child over loopback. Enable only
          # loopback inside the fresh network namespace, then drop privileges.
          sudo unshare --net -- /bin/bash -euc '
            ip link set dev lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs \
              env -i PATH="$3" DOTNET_ROOT="$4" HOME="$5" NUGET_PACKAGES="$5/.nuget/packages" \
              python3 -B scripts/rust_differential_receipt.py \
              --archive "$6/codex-package-x86_64-unknown-linux-musl.tar.gz" \
              --parent-netns "$7" --scope "$8" --output "$6/rust-differential-receipt.json"
          ' bash "$(id -u)" "$(id -g)" "$PATH" "$DOTNET_ROOT" "$HOME" "$RUNNER_TEMP" "$parent_netns" "$DIFFERENTIAL_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-${{ inputs.scope }}-differential-receipt
          path: ${{ runner.temp }}/rust-differential-receipt.json
          if-no-files-found: warn
