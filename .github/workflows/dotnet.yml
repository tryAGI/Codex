name: Build, test and publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, test and publish
    uses: tryAGI/workflows/.github/workflows/dotnet-sdk-build-test-publish.yml@main
    with:
      project-path: Codex.slnx
      dotnet-version: 10.0.x
      # Publish only from a version tag. Pushes to main build and test without releasing.
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      additional-test-arguments: '--logger GitHubActions'
    secrets:
      nuget-key: ${{ secrets.NUGET_KEY }}
