name: Build, test and publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-release-readiness:
    name: Check GPT Live Rust parity release readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.parity.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parity
        run: |
          python3 -B scripts/realtime-parity.py report > parity-report.json
          python3 -B -c 'import json; print("ready=" + str(json.load(open("parity-report.json"))["releaseReady"]).lower())' >> "$GITHUB_OUTPUT"

  build-test-publish:
    name: Build, test and publish
    needs: parity-release-readiness
    uses: tryAGI/workflows/.github/workflows/dotnet-sdk-build-test-publish.yml@main
    with:
      project-path: Codex.slnx
      dotnet-version: 10.0.x
      # Publication requires both the owner's switch and the independent acceptance gate.
      publish: ${{ vars.NUGET_RELEASES == 'true' && needs.parity-release-readiness.outputs.ready == 'true' }}
      additional-test-arguments: '--logger GitHubActions'

  # Fails in seconds when the nuget.org trusted-publishing policy is missing or no longer matches, rather
  # than letting the whole build run and surfacing the mismatch as an HTTP 401 at the push. It declares no
  # `needs`, so it runs beside the build instead of after it, and it has to stay in this workflow for the
  # same reason the push does: nuget.org matches the policy against job_workflow_ref.
  nuget-trusted-publish-check:
    name: Check NuGet trusted publishing
    if: github.event_name == 'push' && vars.NUGET_RELEASES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-trusted-publish-check@main
        with:
          user: havendv

  # NuGet trusted publishing: nuget.org matches the policy (tryAGI / Codex / dotnet.yml) against this
  # workflow file, so both pushes run here rather than inside the reusable workflow.
  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: [build-test-publish, parity-release-readiness]
    if: github.event_name == 'push' && vars.NUGET_RELEASES == 'true' && needs.parity-release-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv

  auto-stable-release:
    name: Automatic stable release
    needs: [nuget-trusted-publish, parity-release-readiness]
    if: github.ref == 'refs/heads/main' && vars.NUGET_RELEASES == 'true' && needs.parity-release-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: automatic-stable-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: tryAGI/workflows/.github/actions/auto-stable-release@main
        with:
          nuget-user: havendv
          project-path: Codex.slnx
          dotnet-version: 10.0.x
          publish-stable: 'true'
