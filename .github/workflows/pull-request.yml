name: Test
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event.pull_request.draft == false
    uses: tryAGI/workflows/.github/workflows/dotnet-sdk-build-test.yml@main
    with:
      project-path: Codex.slnx
      dotnet-version: 10.0.x
      additional-test-arguments: '--logger GitHubActions'
